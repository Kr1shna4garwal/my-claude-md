name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh tests/test.sh claude/hooks/statusline.sh
      - name: Run tests
        run: bash tests/test.sh
